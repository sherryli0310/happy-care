<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy's Sweet Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 萨摩耶主题色调 */
        :root { --bg: #fffaf0; --cloud: #ffffff; --paw-pink: #ffb7b2; --sky-blue: #a2d2ff; --text: #5d4037; --bone-white: #f8f9fa; }
        
        body { 
            background-color: var(--bg); 
            background-image: url('https://www.transparenttextures.com/patterns/paws.png'); /* 背景爪印纹理 */
            font-family: "Microsoft YaHei", sans-serif; 
            color: var(--text); 
            margin: 0; padding: 10px; 
        }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 可爱面板样式 */
        .panel { 
            background: var(--cloud); 
            border-radius: 25px; 
            padding: 18px; 
            margin-bottom: 15px; 
            box-shadow: 0 8px 20px rgba(255, 183, 178, 0.2); 
            border: 3px solid var(--paw-pink);
        }
        
        h2, h3 { color: var(--paw-pink); text-align: center; margin-top: 0; }
        h3 { font-size: 1.1rem; border-bottom: 2px dashed var(--paw-pink); padding-bottom: 5px; margin-bottom: 15px; }

        /* 卡片样式 */
        .card { 
            background: var(--bone-white); 
            border-radius: 15px; 
            padding: 12px; 
            margin-bottom: 10px; 
            border: 1px solid #ffe4e1;
        }

        .row-item { display: flex; gap: 8px; align-items: center; margin-top: 8px; padding: 5px; border-bottom: 1px solid #eee; }
        
        /* 按钮样式 */
        button { 
            background: var(--paw-pink); 
            color: white; border: none; 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.9); }
        .btn-add { background: var(--sky-blue); font-size: 0.8rem; padding: 4px 10px; margin-top: 5px; }
        .btn-save { width: 100%; margin-top: 10px; font-size: 1rem; }

        input, select, textarea { 
            border: 2px solid #eee; border-radius: 10px; 
            padding: 8px; font-size: 0.9rem; outline: none;
        }
        input:focus { border-color: var(--paw-pink); }

        .log-item { 
            background: white; padding: 12px; margin-bottom: 10px; 
            border-radius: 15px; border-left: 8px solid var(--paw-pink);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
        }

        .img-preview { width: 100%; border-radius: 10px; margin-top: 10px; border: 2px solid var(--paw-pink); }
        .chart-container { display: none; } /* 默认隐藏统计图，筛选后显示 */
    </style>
</head>
<body>

<div class="container">
    <h2>☁️ Happy's Fluffy Hub</h2>

    <div class="panel">
        <h3>🐾 日常生活记录</h3>
        
        <div class="card" id="card-eat">
            <strong>🥣 吃饭 (计划2次/天)</strong>
            <div id="eat-rows"></div>
            <button class="btn-add" onclick="addRow('eat')">➕ 添加一餐</button>
        </div>

        <div class="card">
            <strong>💧 喝水 (按需记录)</strong>
            <div class="row-item">
                <select id="water-status"><option>正常</option><option>超量</option><option>少量</option></select>
                <input type="number" id="water-count" placeholder="次数" style="width:60px">
                <button onclick="saveWater()">保存</button>
            </div>
        </div>

        <div class="card" id="card-poo">
            <strong>💩 排便 (计划2-3次/天)</strong>
            <div id="poo-rows"></div>
            <button class="btn-add" onclick="addRow('poo')">➕ 添加便便</button>
        </div>

        <div class="card" id="card-walk">
            <strong>🏃 散步 (计划3次/天)</strong>
            <div id="walk-rows"></div>
            <button class="btn-add" onclick="addRow('walk')">➕ 添加散步</button>
        </div>

        <div class="card" id="card-pee">
            <strong>💦 尿尿 (计划3次/天)</strong>
            <div id="pee-rows"></div>
            <button class="btn-add" onclick="addRow('pee')">➕ 添加尿尿</button>
        </div>
    </div>

    <div class="panel">
        <h3>🏥 专项记录</h3>
        <div class="card">
            <strong>🩺 问诊记录 (支持多格式)</strong>
            <input type="datetime-local" id="clinic-time" class="set-now">
            <textarea id="clinic-note" placeholder="病症详情、医生回访..." style="width:100%; margin-top:5px;"></textarea>
            <input type="file" id="clinic-file" accept="image/*,application/pdf" onchange="handleFile(this)">
            <button class="btn-save" onclick="saveClinic()">同步档案</button>
        </div>
        <div class="grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
            <div class="card">
                <strong>💊 喂药/美容</strong>
                <select id="spec-type"><option>喂药</option><option>洗澡</option><option>剪毛</option></select>
                <button class="btn-save" onclick="saveSpecial()">记录</button>
            </div>
            <div class="card">
                <strong>🛒 采购</strong>
                <input type="number" id="buy-num" placeholder="合数" style="width:100%">
                <button class="btn-save" onclick="saveBuy()">记录</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>📊 趋势统计 (筛选后查看)</h3>
        <div style="display:flex; gap:5px; align-items:center;">
            <input type="date" id="date-start"> 至 <input type="date" id="date-end">
            <button onclick="toggleChart()">查询</button>
        </div>
        <div id="chart-area" class="chart-container">
            <canvas id="happyChart"></canvas>
        </div>
    </div>

    <div class="panel">
        <h3>📜 实时健康档案</h3>
        <div id="log-list">正在嗅探数据...</div>
    </div>
</div>

<script>
    const S_URL = 'https://xvfhbviwxhhovszxmgzs.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2Zmhidml3eGhob3ZzenhtZ3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMDY1NzYsImV4cCI6MjA4Nzc4MjU3Nn0.Ubyh6_cvVvdJfGgMdkkKiqYcELjE-MJRuQiV-2finVE'; 
    const _db = supabase.createClient(S_URL, S_KEY);

    let fileBase64 = "";

    function setNow() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        return now.toISOString().slice(0, 16);
    }

    // 动态添加行逻辑
    function addRow(type) {
        const container = document.getElementById(`${type}-rows`);
        const div = document.createElement('div');
        div.className = 'row-item';
        
        let extraHtml = '';
        if(type === 'eat') extraHtml = `<select><option>吃得香</option><option>不香</option><option>拒食</option></select><input type="number" placeholder="盒" style="width:40px">`;
        if(type === 'walk') extraHtml = `<select><option>小区</option><option>公园</option><option>商场</option></select><select><option>正常</option><option>亢奋</option><option>萎靡</option></select>`;
        if(type === 'poo') extraHtml = `<select><option>正常</option><option>拉稀</option><option>干硬</option></select>`;
        if(type === 'pee') extraHtml = `<select><option>正常</option><option>尿频</option><option>尿少</option></select>`;

        div.innerHTML = `
            <input type="datetime-local" value="${setNow()}" style="font-size:0.7rem">
            ${extraHtml}
            <button style="background:#ff8a80; padding:2px 8px" onclick="this.parentElement.remove()">❌</button>
            <button style="background:#81c784; padding:2px 8px" onclick="saveRow(this, '${type}')">✅</button>
        `;
        container.appendChild(div);
    }

    async function saveRow(btn, type) {
        const row = btn.parentElement;
        const dt = row.querySelector('input[type="datetime-local"]').value;
        const selects = row.querySelectorAll('select');
        const numInput = row.querySelector('input[type="number"]');
        
        const status = Array.from(selects).map(s => s.value).join(' | ') + (numInput ? ` | ${numInput.value}盒` : '');
        
        await upload({
            type: type === 'eat' ? '吃饭' : (type === 'poo' ? '排便' : (type === 'walk' ? '散步' : '尿尿')),
            date: dt.split('T')[0],
            time: dt.split('T')[1],
            status: status
        });
        row.remove();
    }

    // 其他保存逻辑
    async function saveWater() {
        const s = document.getElementById('water-status').value;
        const c = document.getElementById('water-count').value;
        await upload({ type: '喝水', date: new Date().toISOString().split('T')[0], time: new Date().toTimeString().slice(0,5), status: `${s} | ${c}次` });
    }

    function handleFile(input) {
        const reader = new FileReader();
        reader.onload = e => fileBase64 = e.target.result;
        reader.readAsDataURL(input.files[0]);
    }

    async function saveClinic() {
        const dt = document.getElementById('clinic-time').value;
        const note = document.getElementById('clinic-note').value;
        await upload({ type: '问诊', date: dt.split('T')[0], time: dt.split('T')[1], status: note, photo: fileBase64 });
        fileBase64 = "";
    }

    async function upload(payload) {
        // 查重
        const { data: exist } = await _db.from('happy_logs').select('id').eq('type', payload.type).eq('date', payload.date).eq('time', payload.time);
        if (exist && exist.length > 0) return alert("重复记录已被拦截！");

        const { error } = await _db.from('happy_logs').insert([payload]);
        if (!error) { fetchLogs(); } else { alert("上传失败"); }
    }

    async function fetchLogs() {
        const { data } = await _db.from('happy_logs').select('*').order('date', { ascending: false }).order('time', { ascending: false }).limit(30);
        if (data) {
            document.getElementById('log-list').innerHTML = data.map(l => `
                <div class="log-item">
                    <strong>${l.type}</strong> <small>${l.date} ${l.time}</small><br>
                    <span>${l.status}</span>
                    ${l.photo ? (l.photo.includes('pdf') ? '<p>📄 已上传PDF文档</p>' : `<img src="${l.photo}" class="img-preview">`) : ''}
                </div>
            `).join('');
        }
    }

    function toggleChart() {
        const area = document.getElementById('chart-area');
        area.style.display = 'block';
        updateChart();
    }

    async function updateChart() {
        const start = document.getElementById('date-start').value;
        const end = document.getElementById('date-end').value;
        const { data } = await _db.from('happy_logs').select('*').gte('date', start).lte('date', end);
        
        if(data) {
            const ctx = document.getElementById('happyChart').getContext('2d');
            const dates = [...new Set(data.map(l => l.date))].sort();
            if(window.hChart) window.hChart.destroy();
            window.hChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dates,
                    datasets: [{ label: '活动频率', data: dates.map(d => data.filter(l => l.date === d).length), backgroundColor: '#ffb7b2' }]
                }
            });
        }
    }

    // 初始化
    fetchLogs();
    setInterval(fetchLogs, 30000);
</script>

</body>
</html>
