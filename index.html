<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy's Colorful Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #fffaf0; --paw-pink: #ffb7b2; --text: #5d4037; }
        body { background-color: var(--bg); background-image: url('https://www.transparenttextures.com/patterns/paws.png'); font-family: sans-serif; color: var(--text); margin: 0; padding: 15px; }
        
        .main-layout { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
        .input-side { flex: 1.2; min-width: 350px; }
        .log-side { flex: 0.8; min-width: 320px; position: sticky; top: 15px; max-height: 95vh; display: flex; flex-direction: column; }
        
        .panel { background: #fff; border-radius: 20px; padding: 18px; margin-bottom: 15px; border: 3px solid var(--paw-pink); box-shadow: 0 4px 15px rgba(255,183,178,0.2); }
        h3 { color: var(--paw-pink); text-align: center; margin-top: 0; border-bottom: 2px dashed var(--paw-pink); padding-bottom: 5px; }
        
        .card { background: #fdfcfb; border-radius: 12px; padding: 10px; margin-bottom: 8px; border: 1px solid #ffe4e1; }
        .row-item { display: flex; gap: 5px; align-items: center; margin-top: 8px; flex-wrap: wrap; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        
        button { background: var(--paw-pink); color: white; border: none; padding: 8px 12px; border-radius: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.95); }
        .btn-add { background: #a2d2ff; margin-top: 5px; width: 100%; }
        .btn-del { background: rgba(0,0,0,0.1); color: #888; padding: 2px 6px; font-size: 0.7rem; }
        .btn-del:hover { background: #ff8a80; color: white; }

        input, select, textarea { border: 1px solid #ddd; border-radius: 8px; padding: 6px; font-size: 0.85rem; }

        /* 彩色日志 */
        #log-list { overflow-y: auto; flex: 1; }
        .log-item { padding: 10px; margin-bottom: 8px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 10px solid; box-shadow: 2px 2px 8px rgba(0,0,0,0.05); }
        
        .color-吃饭 { background: #fff9c4; border-color: #fbc02d; }
        .color-排便 { background: #efe0d0; border-color: #8d6e63; }
        .color-散步 { background: #e8f5e9; border-color: #66bb6a; }
        .color-尿尿 { background: #e3f2fd; border-color: #42a5f5; }
        .color-喝水 { background: #e0f7fa; border-color: #26c6da; }
        .color-问诊, .color-喂药 { background: #fce4ec; border-color: #ec407a; }
        .color-美容 { background: #f3e5f5; border-color: #ab47bc; }
        .color-采购 { background: #fff3e0; border-color: #ffa726; }

        .status-warn { color: #d32f2f; font-weight: bold; text-decoration: underline; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; }

        @media (max-width: 850px) { .main-layout { flex-direction: column; } .log-side { position: static; max-height: none; } }
        .type-tag { font-size: 0.7rem; background: #eee; padding: 4px 10px; border-radius: 10px; cursor: pointer; margin: 2px; display: inline-block; }
        .type-tag.active { background: var(--paw-pink); color: white; }
    </style>
</head>
<body>

<h2 style="text-align:center; color:var(--paw-pink);">🐾 Happy's Colorful Hub</h2>

<div class="main-layout">
    <div class="input-side">
        <div class="panel">
            <h3>📝 日常录入</h3>
            <div class="card"><strong>🥣 吃饭</strong><div id="eat-rows"></div><button class="btn-add" onclick="addRow('eat')">➕ 添加记录</button></div>
            <div class="card"><strong>💩 排便</strong><div id="poo-rows"></div><button class="btn-add" onclick="addRow('poo')">➕ 添加记录</button></div>
            <div class="card"><strong>🏃 散步</strong><div id="walk-rows"></div><button class="btn-add" onclick="addRow('walk')">➕ 添加记录</button></div>
            <div class="card"><strong>💦 尿尿</strong><div id="pee-rows"></div><button class="btn-add" onclick="addRow('pee')">➕ 添加记录</button></div>
            <div class="card">
                <strong>💧 喝水</strong>
                <div class="row-item">
                    <select id="w-s"><option>正常</option><option>超量</option><option>少量</option></select>
                    <input type="number" id="w-c" placeholder="次" style="width:50px">
                    <button onclick="saveWater()">保存</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>🏥 专项记录</h3>
            <div class="card" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div><strong>💊 喂药/美容</strong><select id="spec-type" style="width:100%"><option>喂药</option><option>洗澡</option><option>剪毛</option></select><button onclick="saveSpecial()" style="width:100%;margin-top:5px">提交</button></div>
                <div><strong>🛒 采购</strong><input type="number" id="buy-num" placeholder="合数" style="width:100%"><button onclick="saveBuy()" style="width:100%;margin-top:5px">提交</button></div>
            </div>
            <div class="card">
                <strong>🩺 问诊档案</strong>
                <input type="datetime-local" id="clinic-dt" style="width:100%">
                <textarea id="clinic-note" placeholder="病症说明..." style="width:100%; margin-top:5px; height:50px;"></textarea>
                <input type="file" id="clinic-file" style="font-size:0.7rem; margin-top:5px;">
                <button onclick="saveClinic()" style="width:100%; margin-top:5px; background:var(--paw-pink)">上传</button>
            </div>
        </div>

        <div class="panel">
            <h3>📊 趋势分析</h3>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="date" id="d-s"> 至 <input type="date" id="d-e">
            </div>
            <div id="type-selector">
                <span class="type-tag active" onclick="this.classList.toggle('active')">吃饭</span>
                <span class="type-tag active" onclick="this.classList.toggle('active')">排便</span>
                <span class="type-tag active" onclick="this.classList.toggle('active')">散步</span>
            </div>
            <button onclick="updateChart()" style="width:100%; background:#a2d2ff; margin-top:10px">生成报表</button>
            <canvas id="happyChart" style="margin-top:15px;"></canvas>
        </div>
    </div>

    <div class="log-side">
        <div class="panel" style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
            <h3>📜 实时健康档案</h3>
            <div id="log-list">正在加载数据...</div>
        </div>
    </div>
</div>
