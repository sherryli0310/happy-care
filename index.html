<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 专业健康管家</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #f4f7f6; --card: #ffffff; --accent: #ffb7b2; --warn: #ff5252; --heavy: #5d4037; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; padding: 10px; color: var(--heavy); font-size: 14px; }
        .panel { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h3 { margin: 0 0 10px 0; font-size: 16px; border-left: 4px solid var(--accent); padding-left: 8px; }
        
        /* 网格布局 */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #fffcf9; padding: 10px; border-radius: 12px; border: 1px solid #eee; }
        .full-card { grid-column: span 2; }
        
        label { font-size: 12px; color: #888; display: block; margin-top: 5px; }
        input, select, textarea { width: 100%; padding: 8px; margin: 4px 0; border-radius: 6px; border: 1px solid #ddd; box-sizing: border-box; font-size: 13px; }
        button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 8px; }
        button:active { opacity: 0.8; }
        
        .log-item { background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 10px; border-left: 5px solid var(--accent); position: relative; }
        .yellow-tag { background: #fff176; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        .img-preview { width: 100%; max-height: 150px; object-fit: contain; background: #eee; margin-top: 5px; border-radius: 5px; }
        
        /* 统计筛选器 */
        .filter-box { display: flex; gap: 5px; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>
<div style="max-width:600px; margin:0 auto;">
    <h2 style="text-align:center; color:var(--heavy);">🐾 Happy 健康管家 Pro</h2>

    <div class="panel">
        <h3>📊 核心五大项记录</h3>
        <div class="grid" id="coreContainer"></div>
    </div>

    <div class="panel">
        <h3>🏥 医疗与专项记录</h3>
        <div class="grid">
            <div class="card">
                <strong>💊 喂药记录</strong>
                <input type="datetime-local" class="dt-now">
                <select id="medS"><option>🐛 驱虫药</option><option>💊 其他药物</option></select>
                <button onclick="saveSpecial('喂药','medS')">保存</button>
            </div>
            <div class="card">
                <strong>🛁 美容管理</strong>
                <input type="datetime-local" class="dt-now">
                <select id="groomS"><option>🛁 洗澡</option><option>✂️ 剪毛</option></select>
                <button onclick="saveSpecial('美容','groomS')">保存</button>
            </div>
            <div class="card full-card">
                <strong>🛒 鲜食采购</strong>
                <input type="datetime-local" class="dt-now">
                <input type="number" id="buyA" placeholder="采购合数">
                <button onclick="savePurchase()">记录采购</button>
            </div>
            <div class="card full-card" style="background: #e3f2fd;">
                <strong>🩺 问诊记录 (病例/账单)</strong>
                <input type="datetime-local" class="dt-now" id="clinicDt">
                <textarea id="clinicNote" placeholder="描述：医生建议、回访细节等"></textarea>
                <input type="file" id="clinicFile" accept="image/*" onchange="handleImg(this, 'clinicPre')">
                <img id="clinicPre" class="img-preview" style="display:none">
                <button onclick="saveClinic()" style="background:#2196f3">上传问诊档案</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>📈 灵活统计趋势</h3>
        <div class="filter-box">
            <input type="date" id="startRange"> 至 <input type="date" id="endRange">
            <button onclick="fetchData()" style="width:60px; margin:0; padding:5px;">查询</button>
        </div>
        <canvas id="myChart" height="180"></canvas>
    </div>

    <div class="panel">
        <h3>📜 实时健康档案</h3>
        <div id="logList">正在同步云端...</div>
    </div>
</div>

<script>
    const S_URL = 'https://xvfhbviwxhhovszxmgzs.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2Zmhidml3eGhob3ZzenhtZ3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMDY1NzYsImV4cCI6MjA4Nzc4MjU3Nn0.Ubyh6_cvVvdJfGgMdkkKiqYcELjE-MJRuQiV-2finVE'; 
    const _db = supabase.createClient(S_URL, S_KEY);

    const CORES = [
        { n: '吃饭', icon: '🥣', opts: ['吃得香', '吃得不香', '完全不吃'], unit: '盒' },
        { n: '喝水', icon: '💧', opts: ['正常', '超量', '少量'], unit: '次' },
        { n: '散步', icon: '🏃', opts: ['正常', '亢奋', '萎靡'], unit: '次' },
        { n: '尿尿', icon: '💦', opts: ['正常', '尿频', '尿少'], unit: '次' },
        { n: '排便', icon: '💩', opts: ['正常', '拉稀', '干硬'], unit: '次' }
    ];

    let clinicImg = "";

    function init() {
        // 设置日期默认值
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        const localTime = now.toISOString().slice(0, 16);
        document.querySelectorAll('.dt-now').forEach(el => el.value = localTime);
        document.getElementById('startRange').value = new Date(Date.now() - 7*86400000).toISOString().split('T')[0];
        document.getElementById('endRange').value = new Date().toISOString().split('T')[0];

        document.getElementById('coreContainer').innerHTML = CORES.map((it, idx) => `
            <div class="card">
                <strong>${it.icon} ${it.n}</strong>
                <label>计划时间</label><input type="datetime-local" id="p_dt_${idx}" class="dt-now">
                <label>实际发生</label><input type="datetime-local" id="a_dt_${idx}" class="dt-now">
                <select id="s_${idx}">${it.opts.map(o => `<option>${o}</option>`).join('')}</select>
                <input type="number" id="v_${idx}" placeholder="数量(${it.unit})">
                <button onclick="saveCore(${idx})">保存记录</button>
            </div>
        `).join('');
        fetchData();
    }

    // 处理图片预览
    function handleImg(input, preId) {
        const reader = new FileReader();
        reader.onload = e => {
            clinicImg = e.target.result;
            const pre = document.getElementById(preId);
            pre.src = clinicImg; pre.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
    }

    // 通用保存：包含防重复检查
    async function upload(payload) {
        // 查重：同天同时间同类型
        const { data: exist } = await _db.from('happy_logs')
            .select('id').eq('type', payload.type).eq('date', payload.date).eq('time', payload.time);
        
        if (exist && exist.length > 0) {
            alert(`⚠️ 警告：${payload.date} ${payload.time} 已有相同记录，已阻止重复提交！`);
            return;
        }

        const { error } = await _db.from('happy_logs').insert([payload]);
        if (error) alert("保存失败: " + error.message);
        else { fetchData(); alert("同步成功！"); }
    }

    // 1. 五大项保存
    async function saveCore(idx) {
        const item = CORES[idx];
        const pDt = document.getElementById(`p_dt_${idx}`).value;
        const aDt = document.getElementById(`a_dt_${idx}`).value;
        const status = document.getElementById(`s_${idx}`).value;
        const val = document.getElementById(`v_${idx}`).value;

        // 计算时间偏差（黄标逻辑）
        const diff = Math.abs(new Date(pDt) - new Date(aDt)) / 60000;
        const warn = diff > 120 ? "⚠️ 偏差过大" : "正常";

        await upload({
            type: item.n,
            date: aDt.split('T')[0],
            time: aDt.split('T')[1],
            status: `${status} | 数值: ${val}${item.unit} | ${warn}`,
            photo: "" // 可根据需要添加图片字段
        });
    }

    // 2. 问诊记录保存
    async function saveClinic() {
        const dt = document.getElementById('clinicDt').value;
        const note = document.getElementById('clinicNote').value;
        await upload({
            type: '问诊',
            date: dt.split('T')[0],
            time: dt.split('T')[1],
            status: note,
            photo: clinicImg
        });
        clinicImg = ""; document.getElementById('clinicPre').style.display = 'none';
    }

    // 专项保存
    async function saveSpecial(type, id) {
        const dt = document.querySelector('.dt-now').value; // 简化处理
        const val = document.getElementById(id).value;
        await upload({ type, date: dt.split('T')[0], time: dt.split('T')[1], status: val });
    }

    async function savePurchase() {
        const dt = document.querySelector('.dt-now').value;
        const val = document.getElementById('buyA').value;
        await upload({ type: '采购', date: dt.split('T')[0], time: dt.split('T')[1], status: `采购了 ${val} 合` });
    }

    // 3. 获取数据与动态图表
    async function fetchData() {
        const start = document.getElementById('startRange').value;
        const end = document.getElementById('endRange').value;
        
        const { data, error } = await _db.from('happy_logs')
            .select('*')
            .gte('date', start)
            .lte('date', end)
            .order('date', { ascending: false });

        if (data) {
            renderLogs(data);
            renderChart(data, start, end);
        }
    }

    function renderLogs(data) {
        document.getElementById('logList').innerHTML = data.map(l => `
            <div class="log-item">
                <strong>${l.type}</strong> <small>${l.date} ${l.time}</small><br>
                <span class="${l.status.includes('⚠️') ? 'yellow-tag' : ''}">${l.status}</span>
                ${l.photo ? `<img src="${l.photo}" class="img-preview">` : ''}
            </div>
        `).join('');
    }

    function renderChart(data, start, end) {
        const ctx = document.getElementById('myChart').getContext('2d');
        const dateLabels = [];
        let curr = new Date(start);
        while(curr <= new Date(end)) {
            dateLabels.push(curr.toISOString().split('T')[0]);
            curr.setDate(curr.getDate() + 1);
        }

        const datasets = CORES.slice(0,3).map((it, i) => ({
            label: it.n,
            data: dateLabels.map(d => data.filter(l => l.date === d && l.type === it.n).length),
            borderColor: ['#ffb7b2', '#81c784', '#64b5f6'][i],
            tension: 0.3
        }));

        if (window.hChart) window.hChart.destroy();
        window.hChart = new Chart(ctx, {
            type: 'line',
            data: { labels: dateLabels.map(d => d.slice(5)), datasets }
        });
    }

    init();
    setInterval(fetchData, 60000);
</script>
</body>
</html>
