<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy's Side-by-Side Care</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #fffaf0; --paw-pink: #ffb7b2; --sky-blue: #a2d2ff; --text: #5d4037; --white: #ffffff; }
        
        body { 
            background-color: var(--bg); 
            background-image: url('https://www.transparenttextures.com/patterns/paws.png'); 
            font-family: "Microsoft YaHei", sans-serif; color: var(--text); margin: 0; padding: 15px; 
        }

        /* 核心左右布局容器 */
        .main-layout { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
        
        /* 左侧：输入面板 */
        .input-side { flex: 1; min-width: 320px; }
        
        /* 右侧：实时档案面板 */
        .log-side { flex: 1; min-width: 320px; position: sticky; top: 15px; max-height: 95vh; display: flex; flex-direction: column; }

        .panel { 
            background: var(--white); border-radius: 20px; padding: 18px; margin-bottom: 15px; 
            border: 3px solid var(--paw-pink); box-shadow: 0 4px 15px rgba(255,183,178,0.2); 
        }

        h2, h3 { color: var(--paw-pink); text-align: center; margin-top: 0; }
        h3 { font-size: 1.1rem; border-bottom: 2px dashed var(--paw-pink); padding-bottom: 5px; margin-bottom: 12px; }

        .card { background: #fdfcfb; border-radius: 12px; padding: 10px; margin-bottom: 8px; border: 1px solid #ffe4e1; }
        .row-item { display: flex; gap: 5px; align-items: center; margin-top: 5px; flex-wrap: wrap; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        /* 按钮与输入 */
        button { background: var(--paw-pink); color: white; border: none; padding: 6px 12px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-add { background: var(--sky-blue); margin-top: 5px; }
        .btn-del { background: #ff8a80; padding: 4px 8px; }
        input, select { border: 1px solid #ddd; border-radius: 8px; padding: 5px; font-size: 0.85rem; }

        /* 日志滚动区 */
        #log-list { overflow-y: auto; flex: 1; padding-right: 5px; }
        .log-item { 
            background: #fffafb; padding: 10px; margin-bottom: 8px; border-radius: 12px; 
            border-left: 6px solid var(--paw-pink); display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); font-size: 0.85rem;
        }

        /* 响应式调整：手机端变回上下排版 */
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .log-side { position: static; max-height: none; }
        }

        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; margin-left: 5px; }
    </style>
</head>
<body>

<h2 style="text-align:center;">☁️ Happy's Fluffy Hub Pro</h2>

<div class="main-layout">
    <div class="input-side">
        <div class="panel">
            <h3>🐾 日常生活录入</h3>
            <div class="card"><strong>🥣 吃饭</strong><div id="eat-rows"></div><button class="btn-add" onclick="addRow('eat')">➕ 添加一餐</button></div>
            <div class="card"><strong>💩 排便</strong><div id="poo-rows"></div><button class="btn-add" onclick="addRow('poo')">➕ 添加便便</button></div>
            <div class="card"><strong>🏃 散步</strong><div id="walk-rows"></div><button class="btn-add" onclick="addRow('walk')">➕ 添加散步</button></div>
            <div class="card"><strong>💦 尿尿</strong><div id="pee-rows"></div><button class="btn-add" onclick="addRow('pee')">➕ 添加尿尿</button></div>
            <div class="card">
                <strong>💧 喝水</strong>
                <div class="row-item">
                    <select id="w-s"><option>正常</option><option>超量</option><option>少量</option></select>
                    <input type="number" id="w-c" placeholder="次数" style="width:45px">
                    <button onclick="saveWater()">保存</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>🏥 专项与统计</h3>
            <div class="card">
                <strong>🩺 问诊记录</strong>
                <input type="datetime-local" id="clinic-dt" style="width:100%">
                <textarea id="clinic-note" placeholder="详情..." style="width:100%; margin-top:5px; height:40px; border-radius:8px; border:1px solid #ddd;"></textarea>
                <input type="file" id="clinic-file" style="font-size:0.7rem; margin-top:5px;">
                <button onclick="saveClinic()" style="width:100%; margin-top:5px;">同步档案</button>
            </div>
            <button onclick="document.getElementById('stats-area').style.display='block'" style="background:var(--sky-blue); width:100%">打开趋势分析报表</button>
            <div id="stats-area" style="display:none; margin-top:10px;">
                <input type="date" id="d-s"> 至 <input type="date" id="d-e">
                <button onclick="updateChart()">查询</button>
                <canvas id="happyChart" style="margin-top:10px;"></canvas>
            </div>
        </div>
    </div>

    <div class="log-side">
        <div class="panel" style="flex:1; display:flex; flex-direction:column;">
            <h3>📜 实时健康档案</h3>
            <div id="log-list">正在嗅探数据...</div>
        </div>
    </div>
</div>

<script>
    const S_URL = 'https://xvfhbviwxhhovszxmgzs.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2Zmhidml3eGhob3ZzenhtZ3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMDY1NzYsImV4cCI6MjA4Nzc4MjU3Nn0.Ubyh6_cvVvdJfGgMdkkKiqYcELjE-MJRuQiV-2finVE'; 
    const _db = supabase.createClient(S_URL, S_KEY);
    let fileB64 = "";

    function getNow() {
        const n = new Date(); n.setMinutes(n.getMinutes() - n.getTimezoneOffset());
        return n.toISOString().slice(0, 16);
    }

    function addRow(type) {
        const container = document.getElementById(`${type}-rows`);
        const div = document.createElement('div');
        div.className = 'row-item';
        let opt = '';
        if(type==='eat') opt='<select><option>吃得香</option><option>不香</option><option>拒食</option></select><input type="number" placeholder="盒" style="width:35px">';
        if(type==='walk') opt='<select><option>小区</option><option>公园</option><option>商场</option></select><select><option>正常</option><option>亢奋</option><option>萎靡</option></select>';
        if(type==='poo') opt='<select><option>正常</option><option>拉稀</option><option>干硬</option></select>';
        if(type==='pee') opt='<select><option>正常</option><option>尿频</option><option>尿少</option></select>';
        
        div.innerHTML = `<input type="datetime-local" value="${getNow()}" style="font-size:0.7rem">${opt}<button style="background:#81c784;padding:2px 6px" onclick="saveRow(this,'${type}')">✅</button>`;
        container.appendChild(div);
    }

    async function saveRow(btn, type) {
        const row = btn.parentElement;
        const dt = row.querySelector('input').value;
        const selects = row.querySelectorAll('select');
        const num = row.querySelector('input[type="number"]');
        const status = Array.from(selects).map(s=>s.value).join('|') + (num?`|${num.value}盒`:'');
        await upload({ type: type==='eat'?'吃饭':(type==='poo'?'排便':(type==='walk'?'散步':'尿尿')), date: dt.split('T')[0], time: dt.split('T')[1], status: status });
        row.remove();
    }

    async function saveWater() { 
        await upload({type:'喝水', date:new Date().toISOString().split('T')[0], time:new Date().toTimeString().slice(0,5), status:document.getElementById('w-s').value+'|'+document.getElementById('w-c').value+'次'}); 
    }

    async function saveClinic() {
        const dt = document.getElementById('clinic-dt').value;
        await upload({type:'问诊', date:dt.split('T')[0], time:dt.split('T')[1], status:document.getElementById('clinic-note').value, photo:fileB64});
        fileB64="";
    }

    function handleFile(input) { const r=new FileReader(); r.onload=e=>fileB64=e.target.result; r.readAsDataURL(input.files[0]); }
    document.getElementById('clinic-file').onchange = (e) => handleFile(e.target);

    async function upload(p) {
        const { error } = await _db.from('happy_logs').insert([p]);
        if(!error) fetchLogs(); else alert("保存失败");
    }

    async function fetchLogs() {
        const { data } = await _db.from('happy_logs').select('*').order('date', {ascending:false}).order('time',{ascending:false}).limit(20);
        if(data) {
            document.getElementById('log-list').innerHTML = data.map(l => `
                <div class="log-item">
                    <div style="flex:1">
                        <strong>${l.type}</strong> <small>${l.date} ${l.time}</small><br>
                        <span>${l.status}</span>
                    </div>
                    ${l.photo?`<img src="${l.photo}" class="img-preview">`:''}
                    <button class="btn-del" onclick="deleteLog(${l.id})">🗑️</button>
                </div>
            `).join('');
        }
    }

    async function deleteLog(id) {
        if(confirm("删除该记录？")) {
            await _db.from('happy_logs').delete().eq('id', id);
            fetchLogs();
        }
    }

    fetchLogs();
    setInterval(fetchLogs, 20000);
</script>
</body>
</html>
