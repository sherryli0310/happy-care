<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy's Family Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #fdf5e6; --card: #ffffff; --text: #5d4037; --accent: #ffb7b2; --green: #c8e6c9; }
        body { background-color: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--text); padding: 15px; margin: 0; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .panel { background: var(--card); padding: 18px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #ffdad9; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: #fffaf0; padding: 12px; border-radius: 15px; border: 1px solid #fce4ec; display: flex; flex-direction: column; }
        .card h3 { margin: 0 0 8px 0; font-size: 1rem; display: flex; align-items: center; }
        button { background: var(--accent); color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 0.9rem; margin-top: auto; }
        button:active { transform: scale(0.98); opacity: 0.8; }
        input, select { width: 100%; padding: 8px; margin: 5px 0 10px 0; border-radius: 8px; border: 1px solid #eee; font-size: 0.9rem; box-sizing: border-box; }
        .log-list { max-height: 400px; overflow-y: auto; }
        .log-item { background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 12px; border-left: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .log-info { display: flex; flex-direction: column; }
        .log-type { font-weight: bold; color: var(--text); }
        .log-time { font-size: 0.75rem; color: #9e9e9e; }
        .log-status { font-size: 0.9rem; background: var(--green); padding: 2px 8px; border-radius: 20px; }
        .alert-box { background: #fff5f5; color: #d32f2f; padding: 10px; border-radius: 10px; font-size: 0.85rem; margin-top: 10px; display: none; border: 1px solid #ffcdd2; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🐾 Happy 云端管家</h1>
        <p style="font-size: 0.8rem; color: #8d6e63;">全家同步 · 实时守护</p>
    </div>
    
    <div class="panel">
        <div class="grid">
            <div class="card">
                <h3>🥣 吃饭</h3>
                <input type="time" id="t1">
                <select id="s1"><option>😋 吃得香</option><option>😐 剩一半</option><option>❌ 没胃口</option></select>
                <button onclick="upload('吃饭','t1','s1')">记一笔</button>
            </div>
            <div class="card">
                <h3>💩 便便</h3>
                <input type="time" id="t2">
                <select id="s2"><option>✅ 正常</option><option>⚠️ 稀(需蒙脱石)</option><option>🧱 硬</option></select>
                <button onclick="upload('便便','t2','s2')">记一笔</button>
            </div>
        </div>
        <div id="medicineAlert" class="alert-box">💡 <b>提醒：</b>如果是拉稀，记得加点蒙脱石散哦！</div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0">📜 全家同步日志</h3>
        <div id="logList" class="log-list">正在加载云端数据...</div>
    </div>
</div>

<script>
    // 🔑 你的 Supabase 钥匙
    const SUPABASE_URL = 'https://xvfhbviwxhhovszxmgzs.supabase.co'; 
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2Zmhidml3eGhob3ZzenhtZ3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMDY1NzYsImV4cCI6MjA4Nzc4MjU3Nn0.Ubyh6_cvVvdJfGgMdkkKiqYcELjE-MJRuQiV-2finVE';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 页面初始化：设置当前时间
    function updateTimeFields() {
        const now = new Date().toTimeString().slice(0,5);
        document.querySelectorAll('input[type="time"]').forEach(i => i.value = now);
    }
    updateTimeFields();

    // 上传数据到云端
    async function upload(type, tId, sId) {
        const time = document.getElementById(tId).value;
        const status = document.getElementById(sId).value;
        const date = new Date().toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });

        // 显示蒙脱石散提醒
        if (type === '便便' && status.includes('稀')) {
            document.getElementById('medicineAlert').style.display = 'block';
        } else {
            document.getElementById('medicineAlert').style.display = 'none';
        }

        // 插入数据库
        const { error } = await _supabase
            .from('happy_logs')
            .insert([{ type, date, time, status }]);

        if (error) {
            alert("同步失败，请确认是否执行了 SQL 解锁命令");
            console.error(error);
        } else {
            fetchLogs(); // 立即刷新列表
        }
    }

    // 从云端获取最新 15 条记录
    async function fetchLogs() {
        const { data, error } = await _supabase
            .from('happy_logs')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(15);
        
        if (data) {
            if (data.length === 0) {
                document.getElementById('logList').innerHTML = "还没有记录，快去记一笔吧！";
                return;
            }
            document.getElementById('logList').innerHTML = data.map(l => `
                <div class="log-item">
                    <div class="log-info">
                        <span class="log-type">${l.type}</span>
                        <span class="log-time">${l.date} ${l.time}</span>
                    </div>
                    <span class="log-status">${l.status}</span>
                </div>
            `).join('');
        }
    }

    // 初始加载
    fetchLogs();
    // 每 20 秒自动更新一次，实现全家准实时同步
    setInterval(fetchLogs, 20000);
</script>
</body>
</html>
