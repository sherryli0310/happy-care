<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy's Ultimate Care</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #fdf5e6; --card: #ffffff; --warn: #fff3cd; --text: #5d4037; --accent: #ffb7b2; --secondary: #b2e2f2; }
        body { 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif; 
            background-color: var(--bg); 
            background-image: radial-gradient(#ffe4e1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text); padding: 20px; 
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1, h2, h3 { color: #8d6e63; }
        .header { text-align: center; margin-bottom: 20px; }
        
        /* 面板通用样式 */
        .panel { background: var(--card); padding: 20px; border-radius: 25px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 2px solid #ffdad9; margin-bottom: 20px; }
        
        /* 布局网格 */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 20px; border: 1px solid #fce4ec; position: relative; }
        
        input, select, button, textarea { width: 100%; padding: 10px; margin: 5px 0; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; outline: none; }
        button { cursor: pointer; border: none; font-weight: bold; background: var(--accent); color: white; transition: 0.3s; }
        button:hover { transform: scale(1.02); filter: brightness(1.05); }

        /* 筛选器样式 */
        .filter-bar { background: #fff; padding: 15px; border-radius: 15px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; border: 2px solid var(--secondary); }
        .filter-bar input { width: auto; }

        /* 日志项 */
        .log-item { background: #fffaf0; padding: 12px; margin-bottom: 10px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #eee; }
        .warning-item { background: var(--warn) !important; border-bottom-color: #f1c40f !important; }
        .delete-btn { width: auto; background: #ff7675; padding: 5px 10px; font-size: 12px; }

        .stats-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-box { background: white; padding: 15px; border-radius: 20px; height: 350px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🐶 Happy 尊享生活管家</h1>
    </div>

    <div class="panel" style="font-size: 0.9em; display: flex; gap: 20px; flex-wrap: wrap;">
        <strong>⚙️ 计划表：</strong>
        <div>🍚 吃饭: <input type="text" id="planFeed" value="08:00, 20:00" style="width:120px"></div>
        <div>🏃 运动: <input type="text" id="planWalk" value="09:00, 15:00, 21:00" style="width:140px"></div>
    </div>

    <div class="panel">
        <div class="grid">
            <div class="card"><h3>🥣 吃饭</h3><input type="date" id="d1"><input type="time" id="t1"><select id="s1"><option>😋 吃得香</option><option>😐 剩一半</option><option>😟 没吃</option></select><button onclick="saveRecord('吃饭','d1','t1','s1')">保存</button></div>
            <div class="card"><h3>🏃 运动</h3><input type="date" id="d2"><input type="time" id="t2"><select id="s2"><option>🐕 精神</option><option>🚶 一般</option><option>💤 累了</option></select><button onclick="saveRecord('运动','d2','t2','s2')">保存</button></div>
            <div class="card"><h3>💩 便便</h3><input type="date" id="d3"><input type="time" id="t3"><select id="s3"><option>✅ 正常</option><option>⚠️ 稀</option><option>🧱 干硬</option></select><button onclick="saveRecord('便便','d3','t3','s3')">保存</button></div>
            <div class="card"><h3>💊 喂药</h3><input type="date" id="d4"><input type="time" id="t4"><select id="s4"><option>🛡️ 驱虫</option><option>🧪 肠胃</option><option>📦 其他</option></select><button onclick="saveRecord('喂药','d4','t4','s4')">保存</button></div>
            <div class="card"><h3>🛁 美容</h3><input type="date" id="d5"><input type="time" id="t5"><select id="s5"><option>🧼 只洗澡</option><option>✂️ 小美容</option></select><button onclick="saveRecord('美容','d5','t5','s5')">保存</button></div>
        </div>
    </div>

    <div class="panel">
        <h3>🛒 采购清单</h3>
        <div class="grid">
            <div class="card" style="background: #f0f7ff;">
                <h4>🥩 鲜食记录</h4>
                <input type="date" id="buyDate1">
                <input type="number" id="buyNum1" placeholder="采购盒数 (例: 80)">
                <textarea id="buyNote1" placeholder="备注 (例: 每天3-4盒)"></textarea>
                <button onclick="savePurchase('鲜食', 'buyDate1', 'buyNum1', 'buyNote1')">记录采购</button>
            </div>
            <div class="card" style="background: #fff0f5;">
                <h4>🧸 玩具记录</h4>
                <input type="date" id="buyDate2">
                <input type="text" id="buyName2" placeholder="玩具名称">
                <button onclick="savePurchase('玩具', 'buyDate2', 'buyName2', null)">记录采购</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <h3>📊 数据分析与搜索筛选</h3>
        <div class="filter-bar">
            📅 从 <input type="date" id="filterStart"> 到 <input type="date" id="filterEnd">
            <button onclick="renderAll()" style="width:auto; padding:5px 15px; background:var(--secondary); color:#333;">立即筛选分析</button>
            <div id="searchStats" style="font-weight: bold; color: #e91e63;"></div>
        </div>
        <div class="stats-area">
            <div class="chart-box"><canvas id="typeChart"></canvas></div>
            <div class="chart-box"><canvas id="poopChart"></canvas></div>
        </div>
    </div>

    <div class="panel">
        <h3>📜 历史日志记录</h3>
        <div id="logList"></div>
    </div>

    <div class="panel">
        <h3>📝 记录瞬间 (照片 & 便签)</h3>
        <input type="file" id="imgInput" accept="image/*" onchange="previewImg()"><img id="photoPreview" style="max-width:200px; display:none; margin:10px 0;">
        <textarea id="memoText" placeholder="今天 Happy 的心情如何？"></textarea>
        <button onclick="saveMemo()" style="background:#00b894;">保存便签</button>
        <div id="memoList" style="margin-top:20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;"></div>
    </div>
</div>

<script>
    function init() {
        const now = new Date();
        const d = now.toISOString().split('T')[0];
        document.querySelectorAll('input[type="date"]').forEach(i => i.value = d);
        document.querySelectorAll('input[type="time"]').forEach(i => i.value = now.toTimeString().slice(0,5));
        // 默认筛选时间：本月
        document.getElementById('filterStart').value = d.slice(0,8) + '01';
        document.getElementById('filterEnd').value = d;
    }
    init();

    let logs = JSON.parse(localStorage.getItem('happy_v4_logs')) || [];
    let memos = JSON.parse(localStorage.getItem('happy_v4_memos')) || [];

    function saveRecord(type, dId, tId, sId) {
        const date = document.getElementById(dId).value;
        const time = document.getElementById(tId).value;
        const status = document.getElementById(sId).value;
        const id = Date.now();

        if (logs.some(l => l.date === date && l.time === time && l.type === type)) {
            alert("重复记录！"); return;
        }

        let isWarn = false;
        const pId = type === '吃饭' ? 'planFeed' : (type === '运动' ? 'planWalk' : '');
        if (pId) {
            const plans = document.getElementById(pId).value.split(',').map(s => s.trim());
            const curH = parseInt(time.split(':')[0]);
            isWarn = !plans.some(p => Math.abs(parseInt(p.split(':')[0]) - curH) <= 2);
        }

        logs.unshift({ id, type, date, time, status, isWarn });
        localStorage.setItem('happy_v4_logs', JSON.stringify(logs));
        if (type === '便便' && status === '⚠️ 稀') alert("⚠️ 提醒：蒙脱石散预备！");
        renderAll();
    }

    function savePurchase(type, dId, vId, nId) {
        const date = document.getElementById(dId).value;
        const val = document.getElementById(vId).value;
        const note = nId ? document.getElementById(nId).value : '';
        if(!val) return;
        logs.unshift({ id: Date.now(), type: '采购-' + type, date, time: '---', status: `${val} ${note}` });
        localStorage.setItem('happy_v4_logs', JSON.stringify(logs));
        renderAll();
    }

    function deleteLog(id) {
        if(confirm("确定删除这条记录吗？")) {
            logs = logs.filter(l => l.id !== id);
            localStorage.setItem('happy_v4_logs', JSON.stringify(logs));
            renderAll();
        }
    }

    function previewImg() {
        const file = document.getElementById('imgInput').files[0];
        const reader = new FileReader();
        reader.onloadend = () => { document.getElementById('photoPreview').src = reader.result; document.getElementById('photoPreview').style.display='block'; }
        if(file) reader.readAsDataURL(file);
    }

    function saveMemo() {
        const text = document.getElementById('memoText').value;
        const img = document.getElementById('photoPreview').src;
        if(!text && !img) return;
        memos.unshift({ text, img, date: new Date().toLocaleString() });
        localStorage.setItem('happy_v4_memos', JSON.stringify(memos));
        document.getElementById('memoText').value = ''; document.getElementById('photoPreview').style.display='none';
        renderAll();
    }

    let c1, c2;
    function renderAll() {
        const start = document.getElementById('filterStart').value;
        const end = document.getElementById('filterEnd').value;
        
        // 筛选数据
        const filtered = logs.filter(l => l.date >= start && l.date <= end);

        // 统计搜索结果
        const s = { 吃饭: 0, 运动: 0, 便便: 0, 喂药: 0, 美容: 0 };
        filtered.forEach(l => { if(s[l.type] !== undefined) s[l.type]++; });
        document.getElementById('searchStats').innerText = `🔍 期间：吃饭${s.吃饭}次, 运动${s.运动}次, 便便${s.便便}次`;

        // 日志列表
        document.getElementById('logList').innerHTML = filtered.slice(0, 30).map(l => `
            <div class="log-item ${l.isWarn ? 'warning-item' : ''}">
                <div><strong>${l.type}</strong> <small>${l.date} ${l.time}</small><br>${l.status}</div>
                <button class="delete-btn" onclick="deleteLog(${l.id})">❌ 删除</button>
            </div>
        `).join('');

        // 饼图：权重百分比
        const ctx1 = document.getElementById('typeChart').getContext('2d');
        if(c1) c1.destroy();
        const total = filtered.length || 1;
        c1 = new Chart(ctx1, {
            type: 'pie',
            data: {
                labels: Object.keys(s),
                datasets: [{ data: Object.values(s), backgroundColor: ['#ffb7b2','#b2e2f2','#ffdac1','#e2f0cb','#dec4ff'] }]
            },
            options: { 
                plugins: { 
                    title: { display: true, text: '活动占比 (%)' },
                    tooltip: { callbacks: { label: (ctx) => {
                        let v = ctx.raw;
                        return `${ctx.label}: ${v}次 (${((v/total)*100).toFixed(1)}%)`;
                    }}}
                },
                maintainAspectRatio: false 
            }
        });

        // 便便柱状图
        const pS = { '正常': 0, '⚠️ 稀': 0, '🧱 干硬': 0 };
        filtered.filter(l => l.type === '便便').forEach(l => pS[l.status]++);
        const ctx2 = document.getElementById('poopChart').getContext('2d');
        if(c2) c2.destroy();
        c2 = new Chart(ctx2, {
            type: 'bar',
            data: { labels: Object.keys(pS), datasets: [{ label: '次数', data: Object.values(pS), backgroundColor: '#ff9aa2' }] },
            options: { maintainAspectRatio: false }
        });

        // 渲染便签
        document.getElementById('memoList').innerHTML = memos.slice(0,6).map(m => `
            <div style="background:#fff; padding:10px; border-radius:15px; border:1px solid #ffdad9; font-size:0.9em;">
                ${m.img.startsWith('data') ? `<img src="${m.img}" style="width:100%; border-radius:10px;">` : ''}
                <p>${m.text}</p><small style="color:#999;">${m.date}</small>
            </div>
        `).join('');
    }

    renderAll();
</script>
</body>
</html>
